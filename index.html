<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>双人贪吃蛇对战</title>
  <style>
    html,body{height:100%;margin:0;font-family:Segoe UI,Roboto,Arial;}
    .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;background:#f0f4f8}
    canvas{background:#071029;border:6px solid #0b2436;border-radius:8px;display:block}
    .hud{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
    .score{font-size:18px;color:#03314b}
    .score .p1{color:#4a8c1a;font-weight:bold}
    .score .p2{color:#1a5ac8;font-weight:bold}
    .controls{display:flex;gap:6px}
    button{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
    .overlay{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
    .msg{color:#022233;font-size:16px;text-align:center}
    .touch-controls{display:none;gap:6px;margin-top:8px}
    .touch-controls button{width:56px;height:56px;border-radius:8px;font-weight:bold}
    @media (max-width:520px){
      .touch-controls{display:flex;flex-wrap:wrap;justify-content:center}
      canvas{width:320px;height:320px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="score">玩家1: <span id="score1" class="p1">0</span></div>
      <div class="score">玩家2: <span id="score2" class="p2">0</span></div>
      <div class="controls">
        <button id="btn-start">开始/暂停</button>
        <button id="btn-restart">重新开始</button>
      </div>
    </div>

    <div class="overlay">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="msg" id="status">玩家1: WASD · 玩家2: 方向键 · 按键开始</div>
      <div class="touch-controls" id="touch">
        <button data-dir="up">↑</button>
        <button data-dir="left">←</button>
        <button data-dir="down">↓</button>
        <button data-dir="right">→</button>
      </div>
    </div>
    <div style="font-size:12px;color:#4b6b80">空格重新开始 · 回车开始/暂停 · 双人模式推荐桌面端键盘对战</div>
  </div>

<script>
(() => {
  // ===== 常量层 =====
  const COLS = 24;
  const ROWS = 24;
  const INIT_SPEED = 120;
  const MIN_SPEED = 40;
  const SPEED_STEP = 4;
  const DIR = {
    LEFT: {x:-1,y:0},
    RIGHT: {x:1,y:0},
    UP: {x:0,y:-1},
    DOWN: {x:0,y:1},
  };
  const P1_KEYS = {
    'w':DIR.UP,'W':DIR.UP,'a':DIR.LEFT,'A':DIR.LEFT,
    's':DIR.DOWN,'S':DIR.DOWN,'d':DIR.RIGHT,'D':DIR.RIGHT
  };
  const P2_KEYS = {
    'ArrowUp':DIR.UP,'ArrowLeft':DIR.LEFT,
    'ArrowDown':DIR.DOWN,'ArrowRight':DIR.RIGHT
  };

  // ===== DOM 引用 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl1 = document.getElementById('score1');
  const scoreEl2 = document.getElementById('score2');
  const statusEl = document.getElementById('status');
  const btnStart = document.getElementById('btn-start');
  const btnRestart = document.getElementById('btn-restart');
  const touch = document.getElementById('touch');
  const cellW = canvas.width / COLS;
  const cellH = canvas.height / ROWS;

  // ===== 状态层 =====
  let players, food, totalEaten, speed, running, gameState, timerId;

  // ===== 工具层 =====
  function isOpposite(a, b) {
    return a.x + b.x === 0 && a.y + b.y === 0;
  }

  function occupiedCells() {
    const cells = [];
    for (const p of players) {
      for (const c of p.snake) cells.push({x:c.x, y:c.y});
    }
    return cells;
  }

  function roundRectFill(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ===== 游戏逻辑层 =====
  function reset() {
    players = [
      {
        id: '玩家1',
        snake: [{x:6,y:11},{x:5,y:11},{x:4,y:11}],
        dir: DIR.RIGHT,
        nextDir: DIR.RIGHT,
        score: 0,
        alive: true,
        colorHead: '#9ef01a',
        colorBody: 'green',
      },
      {
        id: '玩家2',
        snake: [{x:17,y:12},{x:18,y:12},{x:19,y:12}],
        dir: DIR.LEFT,
        nextDir: DIR.LEFT,
        score: 0,
        alive: true,
        colorHead: '#3b9eff',
        colorBody: 'blue',
      },
    ];
    food = null;
    totalEaten = 0;
    speed = INIT_SPEED;
    running = false;
    gameState = '待开始';
    spawnFood();
    updateHUD();
    draw();
    showStatus('玩家1: WASD · 玩家2: 方向键 · 按键开始');
    btnStart.textContent = '开始/暂停';
    clearInterval(timerId);
  }

  function start() {
    if (gameState === '游戏结束') return;
    if (running) {
      running = false;
      gameState = '已暂停';
      clearInterval(timerId);
      showStatus('已暂停');
      btnStart.textContent = '继续';
    } else {
      running = true;
      gameState = '进行中';
      timerId = setInterval(tick, speed);
      showStatus('进行中');
      btnStart.textContent = '暂停';
    }
  }

  function spawnFood() {
    const occupied = occupiedCells();
    const free = [];
    for (let y=0; y<ROWS; y++) {
      for (let x=0; x<COLS; x++) {
        if (!occupied.some(c => c.x===x && c.y===y)) {
          free.push({x,y});
        }
      }
    }
    if (free.length === 0) {
      food = null;
      return false;
    }
    food = free[Math.floor(Math.random()*free.length)];
    return true;
  }

  // 节拍阶段1：计算两蛇新蛇头
  function computeHeads() {
    for (const p of players) {
      if (p.alive) {
        p.dir = p.nextDir;
        p._newHead = {x: p.snake[0].x + p.dir.x, y: p.snake[0].y + p.dir.y};
      } else {
        p._newHead = null;
      }
    }
  }

  // 节拍阶段2：碰撞判定（头对头优先）
  function resolveCollisions() {
    const h1 = players[0]._newHead;
    const h2 = players[1]._newHead;
    if (h1 && h2 && h1.x === h2.x && h1.y === h2.y) {
      players[0].alive = false;
      players[1].alive = false;
      return;
    }
    for (let i=0; i<2; i++) {
      const p = players[i];
      const other = players[1-i];
      const head = p._newHead;
      if (!head) continue;
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        p.alive = false;
        continue;
      }
      const body = p.snake.slice(0, -1);
      if (body.some(c => c.x === head.x && c.y === head.y)) {
        p.alive = false;
        continue;
      }
      if (other.snake.some(c => c.x === head.x && c.y === head.y)) {
        p.alive = false;
        continue;
      }
    }
  }

  // 节拍阶段3：提交位移、进食、提速
  function applyMoves() {
    let ate = false;
    for (const p of players) {
      if (!p.alive) continue;
      p.snake.unshift(p._newHead);
      if (food && p._newHead.x === food.x && p._newHead.y === food.y) {
        p.score++;
        totalEaten++;
        ate = true;
      } else {
        p.snake.pop();
      }
    }
    if (ate) {
      speed = Math.max(MIN_SPEED, INIT_SPEED - totalEaten * SPEED_STEP);
      if (!spawnFood()) {
        players[0].alive = false;
        players[1].alive = false;
      }
      clearInterval(timerId);
      timerId = setInterval(tick, speed);
      updateHUD();
    }
  }

  function tick() {
    computeHeads();
    resolveCollisions();
    applyMoves();
    draw();
    if (!players[0].alive && !players[1].alive) {
      judgeGameOver();
    }
  }

  function judgeGameOver() {
    running = false;
    clearInterval(timerId);
    gameState = '游戏结束';
    let text;
    const s1 = players[0].score;
    const s2 = players[1].score;
    if (players[0].alive && !players[1].alive) {
      text = '玩家1 胜出 · 玩家1: ' + s1 + ' · 玩家2: ' + s2;
    } else if (!players[0].alive && players[1].alive) {
      text = '玩家2 胜出 · 玩家1: ' + s1 + ' · 玩家2: ' + s2;
    } else {
      if (s1 > s2) {
        text = '玩家1 胜出 · 玩家1: ' + s1 + ' · 玩家2: ' + s2;
      } else if (s1 < s2) {
        text = '玩家2 胜出 · 玩家1: ' + s1 + ' · 玩家2: ' + s2;
      } else {
        text = '平局 · 双方: ' + s1;
      }
    }
    showStatus(text + ' · 按 空格 或 点击 重新开始');
    btnStart.textContent = '开始/继续';
  }

  // ===== 渲染层 =====
  function updateHUD() {
    scoreEl1.textContent = players[0].score;
    scoreEl2.textContent = players[1].score;
  }

  function showStatus(text) {
    statusEl.textContent = text;
  }

  function draw() {
    drawBackground();
    drawFood();
    for (const p of players) drawSnake(p);
  }

  function drawBackground() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let r=0; r<ROWS; r++) {
      for (let c=0; c<COLS; c++) {
        if ((r+c)%2===0) ctx.fillStyle = '#07172a';
        else ctx.fillStyle = '#061226';
        ctx.fillRect(c*cellW, r*cellH, cellW, cellH);
      }
    }
  }

  function drawFood() {
    if (!food) return;
    ctx.fillStyle = '#ff3b3b';
    roundRectFill(food.x*cellW+cellW*0.12, food.y*cellH+cellH*0.12, cellW*0.76, cellH*0.76, 6);
  }

  function drawSnake(player) {
    const snake = player.snake;
    for (let i=snake.length-1; i>=0; i--) {
      const p = snake[i];
      if (i === 0) {
        ctx.fillStyle = player.colorHead;
        roundRectFill(p.x*cellW+2, p.y*cellH+2, cellW-4, cellH-4, 6);
      } else {
        const t = 1 - i/snake.length;
        if (player.colorBody === 'green') {
          ctx.fillStyle = `rgba(${Math.floor(4+t*80)},${Math.floor(140+t*80)},${Math.floor(20+t*40)},1)`;
        } else {
          ctx.fillStyle = `rgba(${Math.floor(4+t*80)},${Math.floor(80+t*80)},${Math.floor(200+t*55)},1)`;
        }
        roundRectFill(p.x*cellW+4, p.y*cellH+4, cellW-8, cellH-8, 5);
      }
    }
  }

  // ===== 输入分发层 =====
  function trySetDir(player, d) {
    if (!d) return;
    if (gameState === '游戏结束') return;
    if (isOpposite(d, player.dir)) return;
    player.nextDir = d;
    if (!running && gameState !== '游戏结束') {
      start();
    }
  }

  window.addEventListener('keydown', (e) => {
    const key = e.key;
    if (P1_KEYS[key]) {
      trySetDir(players[0], P1_KEYS[key]);
    }
    if (P2_KEYS[key]) {
      e.preventDefault();
      trySetDir(players[1], P2_KEYS[key]);
    }
    if (key === ' ') {
      e.preventDefault();
      reset();
      start();
    }
    if (key === 'Enter') {
      start();
    }
  });

  btnStart.addEventListener('click', start);
  btnRestart.addEventListener('click', () => { reset(); start(); });

  touch.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const d = btn.dataset.dir;
    if (d==='up') trySetDir(players[0], DIR.UP);
    if (d==='down') trySetDir(players[0], DIR.DOWN);
    if (d==='left') trySetDir(players[0], DIR.LEFT);
    if (d==='right') trySetDir(players[0], DIR.RIGHT);
  });

  // ===== 初始化 =====
  reset();

})();
</script>
</body>
</html>
