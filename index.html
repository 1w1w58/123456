<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>双人贪吃蛇对战</title>
  <style>
    html,body{height:100%;margin:0;font-family:Segoe UI,Roboto,Arial;}
    .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;background:#f0f4f8}
    canvas{background:#071029;border:6px solid #0b2436;border-radius:8px;display:block}
    .hud{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
    .score{font-size:18px;color:#03314b}
    .score .p1{color:#4a8c1a;font-weight:bold}
    .score .p2{color:#1a5ac8;font-weight:bold}
    .controls{display:flex;gap:6px}
    button{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
    .overlay{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
    .msg{color:#022233;font-size:16px;text-align:center}
    .touch-controls{display:none;gap:6px;margin-top:8px}
    .touch-controls button{width:56px;height:56px;border-radius:8px;font-weight:bold}
    .naming-panel{display:none;flex-direction:column;align-items:center;gap:12px;padding:18px 24px;background:#fff;border:1px solid #cfe3f5;border-radius:10px;box-shadow:0 4px 14px rgba(30,80,140,0.14)}
    .naming-panel.show{display:flex}
    .naming-title{font-size:16px;color:#03314b;font-weight:bold}
    .naming-row{display:flex;align-items:center;gap:10px}
    .naming-label{font-size:14px;font-weight:bold;width:52px;text-align:right}
    .naming-label.p1{color:#4a8c1a}
    .naming-label.p2{color:#1a5ac8}
    .name-input{padding:7px 10px;border-radius:6px;border:2px solid #ccc;font-size:14px;width:170px;outline:none;background:#fff}
    .p1-input{border-color:#9ef01a}
    .p1-input:focus{border-color:#4a8c1a;box-shadow:0 0 0 2px rgba(158,240,26,0.25)}
    .p2-input{border-color:#3b9eff}
    .p2-input:focus{border-color:#1a5ac8;box-shadow:0 0 0 2px rgba(59,158,255,0.25)}
    .btn-confirm{padding:8px 22px;border-radius:6px;border:1px solid #1a5ac8;background:#3b9eff;color:#fff;font-weight:bold;cursor:pointer;margin-top:2px}
    .btn-confirm:hover{background:#1a5ac8}
    @media (max-width:520px){
      .touch-controls{display:flex;flex-wrap:wrap;justify-content:center}
      canvas{width:320px;height:320px}
      .naming-panel{padding:14px 16px}
      .name-input{width:140px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="score"><span id="name1" class="p1">玩家1</span>: <span id="score1" class="p1">0</span></div>
      <div class="score"><span id="name2" class="p2">玩家2</span>: <span id="score2" class="p2">0</span></div>
      <div class="controls">
        <button id="btn-start">开始/暂停</button>
        <button id="btn-restart">重新开始</button>
      </div>
    </div>

    <div class="naming-panel" id="naming-panel">
      <div class="naming-title">为你的角色取名</div>
      <div class="naming-row">
        <label class="naming-label p1" for="name-input-1">玩家1</label>
        <input type="text" id="name-input-1" class="name-input p1-input" maxlength="8" placeholder="留空则显示玩家1" />
      </div>
      <div class="naming-row">
        <label class="naming-label p2" for="name-input-2">玩家2</label>
        <input type="text" id="name-input-2" class="name-input p2-input" maxlength="8" placeholder="留空则显示玩家2" />
      </div>
      <button id="btn-confirm-names" class="btn-confirm">开始对战</button>
    </div>

    <div class="overlay">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="msg" id="status">玩家1: WASD · 玩家2: 方向键 · 按键开始</div>
      <div class="touch-controls" id="touch">
        <button data-dir="up">↑</button>
        <button data-dir="left">←</button>
        <button data-dir="down">↓</button>
        <button data-dir="right">→</button>
      </div>
    </div>
    <div style="font-size:12px;color:#4b6b80">空格重新开始 · 回车开始/暂停 · 双人模式推荐桌面端键盘对战</div>
  </div>

<script>
(() => {
  // ===== 常量层 =====
  const COLS = 24;
  const ROWS = 24;
  const INIT_SPEED = 120;
  const MIN_SPEED = 40;
  const SPEED_STEP = 4;
  const DIR = {
    LEFT: {x:-1,y:0},
    RIGHT: {x:1,y:0},
    UP: {x:0,y:-1},
    DOWN: {x:0,y:1},
  };
  const P1_KEYS = {
    'w':DIR.UP,'W':DIR.UP,'a':DIR.LEFT,'A':DIR.LEFT,
    's':DIR.DOWN,'S':DIR.DOWN,'d':DIR.RIGHT,'D':DIR.RIGHT
  };
  const P2_KEYS = {
    'ArrowUp':DIR.UP,'ArrowLeft':DIR.LEFT,
    'ArrowDown':DIR.DOWN,'ArrowRight':DIR.RIGHT
  };
  const MAX_NAME_LENGTH = 8;
  const DEFAULT_NAMES = { '玩家1': '玩家1', '玩家2': '玩家2' };
  const CONTROL_CHAR_REGEX = /[\x00-\x1f\x7f]/g;

  // ===== DOM 引用 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const name1El = document.getElementById('name1');
  const name2El = document.getElementById('name2');
  const scoreEl1 = document.getElementById('score1');
  const scoreEl2 = document.getElementById('score2');
  const statusEl = document.getElementById('status');
  const btnStart = document.getElementById('btn-start');
  const btnRestart = document.getElementById('btn-restart');
  const namingPanel = document.getElementById('naming-panel');
  const nameInput1 = document.getElementById('name-input-1');
  const nameInput2 = document.getElementById('name-input-2');
  const btnConfirmNames = document.getElementById('btn-confirm-names');
  const touch = document.getElementById('touch');
  const cellW = canvas.width / COLS;
  const cellH = canvas.height / ROWS;

  // ===== 状态层 =====
  let players, food, totalEaten, speed, running, gameState, timerId;
  let lastConfirmedNames = null;

  // ===== 工具层 =====
  function isOpposite(a, b) {
    return a.x + b.x === 0 && a.y + b.y === 0;
  }

  function occupiedCells() {
    const cells = [];
    for (const p of players) {
      for (const c of p.snake) cells.push({x:c.x, y:c.y});
    }
    return cells;
  }

  function roundRectFill(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ===== 命名层 =====
  // 名称校验器（纯函数）
  const NameValidator = {
    validate(raw, playerId) {
      let value = raw == null ? '' : String(raw);
      value = this.trim(value);
      value = this.filterControl(value);
      value = this.truncate(value);
      if (this.needFallback(value)) {
        return { name: DEFAULT_NAMES[playerId], fellBackToDefault: true, reason: '名称无效，已使用默认名称' };
      }
      return { name: value, fellBackToDefault: false, reason: null };
    },
    trim(value) {
      return value.trim();
    },
    filterControl(value) {
      return value.replace(CONTROL_CHAR_REGEX, '');
    },
    truncate(value) {
      return value.slice(0, MAX_NAME_LENGTH);
    },
    needFallback(value) {
      if (value.length === 0) return true;
      if (value === '0') return true;
      const meaningfulRegex = /[a-zA-Z0-9\u4e00-\u9fff]/;
      return !meaningfulRegex.test(value);
    }
  };

  // 名称输入界面
  const NamingPanel = {
    show(prefill) {
      if (prefill && prefill.p1 != null && prefill.p1 !== '') {
        nameInput1.value = prefill.p1;
      } else {
        nameInput1.value = '';
      }
      if (prefill && prefill.p2 != null && prefill.p2 !== '') {
        nameInput2.value = prefill.p2;
      } else {
        nameInput2.value = '';
      }
      namingPanel.classList.add('show');
    },
    hide() {
      namingPanel.classList.remove('show');
      nameInput1.blur();
      nameInput2.blur();
    },
    getRawInputs() {
      return { p1: nameInput1.value, p2: nameInput2.value };
    }
  };

  // 名称沿用管理（纯内存，不持久化）
  const NamePersistence = {
    save(names) {
      lastConfirmedNames = { p1: names.p1, p2: names.p2 };
    },
    load() {
      return lastConfirmedNames;
    }
  };

  function confirmNames(raw1, raw2) {
    const r1 = NameValidator.validate(raw1, players[0].id);
    const r2 = NameValidator.validate(raw2, players[1].id);
    players[0].name = r1.name;
    players[0].rawInput = raw1;
    players[0].confirmed = true;
    players[1].name = r2.name;
    players[1].rawInput = raw2;
    players[1].confirmed = true;
    return { p1: r1, p2: r2 };
  }

  function applyNamesToHUD() {
    name1El.textContent = players[0].name;
    name2El.textContent = players[1].name;
  }

  function confirmNamesAndStart() {
    if (gameState !== '待开始') return;
    const raw = NamingPanel.getRawInputs();
    const result = confirmNames(raw.p1, raw.p2);
    const fellBack = result.p1.fellBackToDefault || result.p2.fellBackToDefault;
    NamingPanel.hide();
    applyNamesToHUD();
    start();
    if (fellBack) {
      showStatus('名称无效，已使用默认名称 · 进行中');
    }
  }

  function filterNameInput(input) {
    let value = input.value;
    value = value.replace(CONTROL_CHAR_REGEX, '');
    value = value.slice(0, MAX_NAME_LENGTH);
    if (value !== input.value) {
      input.value = value;
    }
  }

  // ===== 游戏逻辑层 =====
  function buildPlayers() {
    return [
      {
        id: '玩家1',
        snake: [{x:6,y:11},{x:5,y:11},{x:4,y:11}],
        dir: DIR.RIGHT,
        nextDir: DIR.RIGHT,
        score: 0,
        alive: true,
        colorHead: '#9ef01a',
        colorBody: 'green',
        name: '玩家1',
        rawInput: '',
        confirmed: false,
      },
      {
        id: '玩家2',
        snake: [{x:17,y:12},{x:18,y:12},{x:19,y:12}],
        dir: DIR.LEFT,
        nextDir: DIR.LEFT,
        score: 0,
        alive: true,
        colorHead: '#3b9eff',
        colorBody: 'blue',
        name: '玩家2',
        rawInput: '',
        confirmed: false,
      },
    ];
  }

  function resetGameState() {
    players = buildPlayers();
    food = null;
    totalEaten = 0;
    speed = INIT_SPEED;
    running = false;
    gameState = '待开始';
    spawnFood();
    updateHUD();
    draw();
    btnStart.textContent = '开始/暂停';
    clearInterval(timerId);
  }

  function showNamingPanel(prefill) {
    NamingPanel.show(prefill);
    showStatus('请为角色取名后点击开始对战');
  }

  function restartGame() {
    if (players && players[0] && players[0].confirmed) {
      NamePersistence.save({ p1: players[0].name, p2: players[1].name });
    }
    resetGameState();
    showNamingPanel(NamePersistence.load());
  }

  function start() {
    if (gameState === '游戏结束') return;
    if (running) {
      running = false;
      gameState = '已暂停';
      clearInterval(timerId);
      showStatus('已暂停');
      btnStart.textContent = '继续';
    } else {
      running = true;
      gameState = '进行中';
      timerId = setInterval(tick, speed);
      showStatus('进行中');
      btnStart.textContent = '暂停';
    }
  }

  function spawnFood() {
    const occupied = occupiedCells();
    const free = [];
    for (let y=0; y<ROWS; y++) {
      for (let x=0; x<COLS; x++) {
        if (!occupied.some(c => c.x===x && c.y===y)) {
          free.push({x,y});
        }
      }
    }
    if (free.length === 0) {
      food = null;
      return false;
    }
    food = free[Math.floor(Math.random()*free.length)];
    return true;
  }

  // 节拍阶段1：计算两蛇新蛇头
  function computeHeads() {
    for (const p of players) {
      if (p.alive) {
        p.dir = p.nextDir;
        p._newHead = {x: p.snake[0].x + p.dir.x, y: p.snake[0].y + p.dir.y};
      } else {
        p._newHead = null;
      }
    }
  }

  // 节拍阶段2：碰撞判定（头对头优先）
  function resolveCollisions() {
    const h1 = players[0]._newHead;
    const h2 = players[1]._newHead;
    if (h1 && h2 && h1.x === h2.x && h1.y === h2.y) {
      players[0].alive = false;
      players[1].alive = false;
      return;
    }
    for (let i=0; i<2; i++) {
      const p = players[i];
      const other = players[1-i];
      const head = p._newHead;
      if (!head) continue;
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        p.alive = false;
        continue;
      }
      const body = p.snake.slice(0, -1);
      if (body.some(c => c.x === head.x && c.y === head.y)) {
        p.alive = false;
        continue;
      }
      if (other.snake.some(c => c.x === head.x && c.y === head.y)) {
        p.alive = false;
        continue;
      }
    }
  }

  // 节拍阶段3：提交位移、进食、提速
  function applyMoves() {
    let ate = false;
    for (const p of players) {
      if (!p.alive) continue;
      p.snake.unshift(p._newHead);
      if (food && p._newHead.x === food.x && p._newHead.y === food.y) {
        p.score++;
        totalEaten++;
        ate = true;
      } else {
        p.snake.pop();
      }
    }
    if (ate) {
      speed = Math.max(MIN_SPEED, INIT_SPEED - totalEaten * SPEED_STEP);
      if (!spawnFood()) {
        players[0].alive = false;
        players[1].alive = false;
      }
      clearInterval(timerId);
      timerId = setInterval(tick, speed);
      updateHUD();
    }
  }

  function tick() {
    computeHeads();
    resolveCollisions();
    applyMoves();
    draw();
    if (!players[0].alive && !players[1].alive) {
      judgeGameOver();
    }
  }

  function judgeGameOver() {
    running = false;
    clearInterval(timerId);
    gameState = '游戏结束';
    NamePersistence.save({ p1: players[0].name, p2: players[1].name });
    let text;
    const s1 = players[0].score;
    const s2 = players[1].score;
    const n1 = players[0].name;
    const n2 = players[1].name;
    if (players[0].alive && !players[1].alive) {
      text = n1 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
    } else if (!players[0].alive && players[1].alive) {
      text = n2 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
    } else {
      if (s1 > s2) {
        text = n1 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
      } else if (s1 < s2) {
        text = n2 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
      } else {
        text = '平局 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
      }
    }
    showStatus(text + ' · 按 空格 或 点击 重新开始');
    btnStart.textContent = '开始/继续';
  }

  // ===== 渲染层 =====
  function updateHUD() {
    scoreEl1.textContent = players[0].score;
    scoreEl2.textContent = players[1].score;
    applyNamesToHUD();
  }

  function showStatus(text) {
    statusEl.textContent = text;
  }

  function draw() {
    drawBackground();
    drawFood();
    for (const p of players) drawSnake(p);
  }

  function drawBackground() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let r=0; r<ROWS; r++) {
      for (let c=0; c<COLS; c++) {
        if ((r+c)%2===0) ctx.fillStyle = '#07172a';
        else ctx.fillStyle = '#061226';
        ctx.fillRect(c*cellW, r*cellH, cellW, cellH);
      }
    }
  }

  function drawFood() {
    if (!food) return;
    ctx.fillStyle = '#ff3b3b';
    roundRectFill(food.x*cellW+cellW*0.12, food.y*cellH+cellH*0.12, cellW*0.76, cellH*0.76, 6);
  }

  function drawSnake(player) {
    const snake = player.snake;
    for (let i=snake.length-1; i>=0; i--) {
      const p = snake[i];
      if (i === 0) {
        ctx.fillStyle = player.colorHead;
        roundRectFill(p.x*cellW+2, p.y*cellH+2, cellW-4, cellH-4, 6);
      } else {
        const t = 1 - i/snake.length;
        if (player.colorBody === 'green') {
          ctx.fillStyle = `rgba(${Math.floor(4+t*80)},${Math.floor(140+t*80)},${Math.floor(20+t*40)},1)`;
        } else {
          ctx.fillStyle = `rgba(${Math.floor(4+t*80)},${Math.floor(80+t*80)},${Math.floor(200+t*55)},1)`;
        }
        roundRectFill(p.x*cellW+4, p.y*cellH+4, cellW-8, cellH-8, 5);
      }
    }
  }

  // ===== 输入分发层 =====
  function trySetDir(player, d) {
    if (!d) return;
    if (gameState === '游戏结束') return;
    if (isOpposite(d, player.dir)) return;
    player.nextDir = d;
    if (!running && gameState !== '游戏结束') {
      if (gameState === '待开始') {
        confirmNamesAndStart();
      } else {
        start();
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.target === nameInput1 || e.target === nameInput2) {
      return;
    }
    const key = e.key;
    if (P1_KEYS[key]) {
      trySetDir(players[0], P1_KEYS[key]);
    }
    if (P2_KEYS[key]) {
      e.preventDefault();
      trySetDir(players[1], P2_KEYS[key]);
    }
    if (key === ' ') {
      e.preventDefault();
      restartGame();
    }
    if (key === 'Enter') {
      if (gameState === '待开始') {
        confirmNamesAndStart();
      } else {
        start();
      }
    }
  });

  btnStart.addEventListener('click', () => {
    if (gameState === '待开始') {
      confirmNamesAndStart();
    } else {
      start();
    }
  });
  btnRestart.addEventListener('click', restartGame);
  btnConfirmNames.addEventListener('click', confirmNamesAndStart);

  nameInput1.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      confirmNamesAndStart();
    }
  });
  nameInput2.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      confirmNamesAndStart();
    }
  });
  nameInput1.addEventListener('input', () => { filterNameInput(nameInput1); });
  nameInput2.addEventListener('input', () => { filterNameInput(nameInput2); });

  touch.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const d = btn.dataset.dir;
    if (d==='up') trySetDir(players[0], DIR.UP);
    if (d==='down') trySetDir(players[0], DIR.DOWN);
    if (d==='left') trySetDir(players[0], DIR.LEFT);
    if (d==='right') trySetDir(players[0], DIR.RIGHT);
  });

  // ===== 初始化 =====
  resetGameState();
  showNamingPanel(NamePersistence.load());

})();
</script>
</body>
</html>
