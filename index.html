<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>贪吃蛇对战</title>
  <style>
    html,body{height:100%;margin:0;font-family:Segoe UI,Roboto,Arial;}
    .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;background:#f0f4f8}
    canvas{background:#071029;border:6px solid #0b2436;border-radius:8px;display:block}
    .hud{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
    .score{font-size:18px;color:#03314b}
    .score .p1{color:#4a8c1a;font-weight:bold}
    .score .p2{color:#1a5ac8;font-weight:bold}
    .controls{display:flex;gap:6px}
    button{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
    .overlay{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
    .msg{color:#022233;font-size:16px;text-align:center}
    .touch-controls{display:none;gap:6px;margin-top:8px}
    .touch-controls button{width:56px;height:56px;border-radius:8px;font-weight:bold}
    @media (max-width:520px){
      .touch-controls{display:flex;flex-wrap:wrap;justify-content:center}
      canvas{width:320px;height:320px}
    }

    /* ===== 通用前置设置界面（赛博朋克风格） ===== */
    .setup-stage{
      position:fixed;inset:0;z-index:100;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:#0b2436;color:#cfe8ff;
      font-family:Segoe UI,Roboto,Arial;padding:16px;box-sizing:border-box;
    }
    .setup-stage[hidden]{display:none}
    .stage-title{font-size:26px;font-weight:bold;color:#3b9eff;text-shadow:0 0 14px #3b9eff;letter-spacing:2px}
    .stage-sub{font-size:13px;color:#6b8aa8;margin-top:-10px;text-align:center}
    .stage-tip{min-height:22px;color:#ffe14d;font-size:14px;text-shadow:0 0 6px rgba(255,225,77,.6)}
    .stage-actions{display:flex;gap:14px}
    .stage-actions button{padding:8px 18px;border-radius:8px;cursor:pointer;font-size:15px}
    .stage-next{background:#a24bff;color:#fff;border:1px solid #a24bff;box-shadow:0 0 12px #a24bff;font-weight:bold;animation:stage-blink 2.2s infinite}
    .stage-next:hover{box-shadow:0 0 22px #ff5fbf}
    .stage-back{background:transparent;color:#6b8aa8;border:1px solid #2a4a6a}
    .stage-back:hover{color:#cfe8ff;border-color:#3b9eff}
    @keyframes stage-blink{0%,100%{box-shadow:0 0 12px #a24bff}50%{box-shadow:0 0 20px #ff5fbf}}

    /* ===== 模式选择项 ===== */
    .mode-items{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
    .mode-item{
      width:190px;padding:22px;border-radius:14px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;gap:8px;
      border:2px solid #1a3a5a;background:#07172a;position:relative;overflow:hidden;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .mode-item .mode-name{font-size:18px;font-weight:bold;color:#cfe8ff;position:relative;z-index:1}
    .mode-item .mode-desc{font-size:12px;color:#6b8aa8;text-align:center;position:relative;z-index:1}
    .mode-item:hover{transform:translateY(-2px)}
    .mode-item.selected{border-color:#9ef01a;box-shadow:0 0 18px #9ef01a,inset 0 0 12px rgba(158,240,26,.25);animation:mode-flow 1.6s linear infinite}
    @keyframes mode-flow{0%,100%{box-shadow:0 0 18px #9ef01a,inset 0 0 12px rgba(158,240,26,.25)}50%{box-shadow:0 0 28px #9ef01a,inset 0 0 16px rgba(158,240,26,.4)}}

    /* ===== 名字填写 ===== */
    .name-fields{display:flex;flex-direction:column;gap:18px;align-items:center}
    .name-field{display:flex;flex-direction:column;align-items:center;gap:6px}
    .name-field .name-label{font-size:14px;font-weight:bold;letter-spacing:1px}
    .name-field[data-player="0"] .name-label{color:#9ef01a;text-shadow:0 0 8px #9ef01a}
    .name-field[data-player="1"] .name-label{color:#3b9eff;text-shadow:0 0 8px #3b9eff}
    .name-field input{
      width:240px;padding:10px 14px;border-radius:8px;
      border:2px solid #1a3a5a;background:#07172a;color:#cfe8ff;font-size:16px;
      outline:none;transition:border-color .12s, box-shadow .12s;box-sizing:border-box;
    }
    .name-field input:focus{border-color:#3b9eff;box-shadow:0 0 12px rgba(59,158,255,.4)}

    /* ===== 皮肤颜色选择界面 ===== */
    .skin-selection{
      position:fixed;inset:0;z-index:100;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:#0b2436;color:#cfe8ff;
      font-family:Segoe UI,Roboto,Arial;padding:16px;box-sizing:border-box;
    }
    .skin-selection[hidden]{display:none}
    .skin-title{font-size:26px;font-weight:bold;color:#3b9eff;text-shadow:0 0 14px #3b9eff;letter-spacing:2px}
    .skin-sub{font-size:13px;color:#6b8aa8;margin-top:-10px;text-align:center}
    .skin-players{display:flex;gap:36px;flex-wrap:wrap;justify-content:center}
    .skin-player{display:flex;flex-direction:column;align-items:center;gap:10px}
    .skin-player[hidden]{display:none}
    .skin-player-name{font-size:15px;font-weight:bold;letter-spacing:1px}
    .skin-player[data-player="0"] .skin-player-name{color:#9ef01a;text-shadow:0 0 8px #9ef01a}
    .skin-player[data-player="1"] .skin-player-name{color:#3b9eff;text-shadow:0 0 8px #3b9eff}
    .skin-items{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .skin-item{
      width:66px;height:74px;border-radius:12px;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
      border:2px solid #1a3a5a;background:#07172a;position:relative;overflow:hidden;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .skin-item::before{
      content:"";position:absolute;inset:0;
      background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(59,158,255,.05) 3px 4px);
      pointer-events:none;
    }
    .skin-item .swatch{width:38px;height:38px;border-radius:9px;box-shadow:0 0 10px currentColor;position:relative;z-index:1}
    .skin-item .label{font-size:11px;color:#cfe8ff;position:relative;z-index:1}
    .skin-item:hover{transform:translateY(-2px)}
    .skin-item.selected-p1{border-color:#9ef01a;box-shadow:0 0 16px #9ef01a,inset 0 0 10px rgba(158,240,26,.25);animation:skin-flow-p1 1.6s linear infinite}
    .skin-item.selected-p2{border-color:#3b9eff;box-shadow:0 0 16px #3b9eff,inset 0 0 10px rgba(59,158,255,.25);animation:skin-flow-p2 1.6s linear infinite}
    .skin-item.selected-p1.selected-p2{border-color:#a24bff;box-shadow:0 0 18px #a24bff,inset 0 0 10px rgba(162,75,255,.3)}
    @keyframes skin-flow-p1{0%,100%{box-shadow:0 0 16px #9ef01a,inset 0 0 10px rgba(158,240,26,.25)}50%{box-shadow:0 0 26px #9ef01a,inset 0 0 14px rgba(158,240,26,.4)}}
    @keyframes skin-flow-p2{0%,100%{box-shadow:0 0 16px #3b9eff,inset 0 0 10px rgba(59,158,255,.25)}50%{box-shadow:0 0 26px #3b9eff,inset 0 0 14px rgba(59,158,255,.4)}}
    .skin-preview{margin-top:2px}
    .skin-preview canvas{border:2px solid #1a3a5a;background:#07172a;border-radius:8px}
    .skin-tip{min-height:22px;color:#ffe14d;font-size:14px;text-shadow:0 0 6px rgba(255,225,77,.6)}
    .skin-actions{display:flex;gap:14px}
    #skin-confirm{background:#a24bff;color:#fff;border:1px solid #a24bff;box-shadow:0 0 12px #a24bff;font-weight:bold;animation:stage-blink 2.2s infinite;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:15px}
    #skin-confirm:hover{box-shadow:0 0 22px #ff5fbf}
    #skin-back{background:transparent;color:#6b8aa8;border:1px solid #2a4a6a;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:15px}
    #skin-back:hover{color:#cfe8ff;border-color:#3b9eff}
    @media (max-width:520px){
      .setup-stage{gap:12px}
      .mode-items{flex-direction:column;gap:14px}
      .mode-item{width:80vw;max-width:280px}
      .name-field input{width:80vw;max-width:280px}
      .stage-title,.skin-title{font-size:20px}
      .skin-players{flex-direction:column;gap:18px}
      .skin-item{width:56px;height:64px}
      .skin-item .swatch{width:30px;height:30px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="score">玩家1: <span id="score1" class="p1">0</span></div>
      <div class="score">玩家2: <span id="score2" class="p2">0</span></div>
      <div class="controls">
        <button id="btn-start">开始/暂停</button>
        <button id="btn-restart">重新开始</button>
      </div>
    </div>

    <div class="overlay">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="msg" id="status">玩家1: WASD · 玩家2: 方向键 · 按键开始</div>
      <div class="touch-controls" id="touch">
        <button data-dir="up">↑</button>
        <button data-dir="left">←</button>
        <button data-dir="down">↓</button>
        <button data-dir="right">→</button>
      </div>
    </div>
    <div style="font-size:12px;color:#4b6b80">空格重新开始 · 回车开始/暂停 · 双人模式推荐桌面端键盘对战</div>
  </div>

  <div id="mode-selection" class="setup-stage" hidden>
    <div class="stage-title">选择对战模式</div>
    <div class="stage-sub">W/S 切换 · Enter 下一步 · Esc 返回</div>
    <div class="mode-items" id="mode-items"></div>
    <div class="stage-tip" id="mode-tip"></div>
    <div class="stage-actions">
      <button id="mode-next" class="stage-next">下一步</button>
      <button id="mode-back" class="stage-back">返回</button>
    </div>
  </div>

  <div id="name-input" class="setup-stage" hidden>
    <div class="stage-title">填写玩家昵称</div>
    <div class="stage-sub">中文/英文/数字/下划线 · 最长 12 字符 · Enter 下一步 · Esc 返回</div>
    <div class="name-fields" id="name-fields"></div>
    <div class="stage-tip" id="name-tip"></div>
    <div class="stage-actions">
      <button id="name-next" class="stage-next">下一步</button>
      <button id="name-back" class="stage-back">返回</button>
    </div>
  </div>

  <div id="skin-selection" class="skin-selection" hidden>
    <div class="skin-title">选择皮肤颜色</div>
    <div class="skin-sub">玩家1: A/D 切换 · 玩家2: ←/→ 切换 · Enter 确认 · Esc 返回</div>
    <div class="skin-players">
      <div class="skin-player" data-player="0">
        <div class="skin-player-name">玩家1</div>
        <div class="skin-items" id="skin-items-0"></div>
      </div>
      <div class="skin-player" data-player="1">
        <div class="skin-player-name">玩家2</div>
        <div class="skin-items" id="skin-items-1"></div>
      </div>
    </div>
    <div class="skin-preview">
      <canvas id="skin-preview-canvas" width="260" height="64"></canvas>
    </div>
    <div class="skin-tip" id="skin-tip"></div>
    <div class="skin-actions">
      <button id="skin-confirm">确认 / 开始对战</button>
      <button id="skin-back">返回</button>
    </div>
  </div>

<script>
(() => {
  // ===== 常量层 =====
  const COLS = 24;
  const ROWS = 24;
  const INIT_SPEED = 120;
  const MIN_SPEED = 40;
  const SPEED_STEP = 4;
  const DEFAULT_SKIN_ID = 'green';
  const DEFAULT_MODE_ID = 'double';
  const CONFIRM_DEBOUNCE_MS = 300;
  const TIP_AUTO_CLEAR_MS = 3000;
  const NAME_MAX_LENGTH = 12;
  const NAME_ALLOWED_REGEX = /^[\u4e00-\u9fa5A-Za-z0-9_]+$/;
  const DIR = {
    LEFT: {x:-1,y:0},
    RIGHT: {x:1,y:0},
    UP: {x:0,y:-1},
    DOWN: {x:0,y:1},
  };
  const P1_KEYS = {
    'w':DIR.UP,'W':DIR.UP,'a':DIR.LEFT,'A':DIR.LEFT,
    's':DIR.DOWN,'S':DIR.DOWN,'d':DIR.RIGHT,'D':DIR.RIGHT
  };
  const P2_KEYS = {
    'ArrowUp':DIR.UP,'ArrowLeft':DIR.LEFT,
    'ArrowDown':DIR.DOWN,'ArrowRight':DIR.RIGHT
  };

  // ===== 颜色配置模块（SkinConfig，6色：蓝/粉/紫/绿/黄/红） =====
  const SkinConfig = (() => {
    const skins = [
      {
        id: 'blue', name: '蓝色', headColor: '#3b9eff', sampleColor: '#3b9eff',
        bodyGradient: (t) => `rgba(${Math.floor(4+t*80)},${Math.floor(80+t*80)},${Math.floor(200+t*55)},1)`
      },
      {
        id: 'pink', name: '粉色', headColor: '#ff5fbf', sampleColor: '#ff5fbf',
        bodyGradient: (t) => `rgba(${Math.floor(120+t*135)},${Math.floor(40+t*55)},${Math.floor(100+t*91)},1)`
      },
      {
        id: 'purple', name: '紫色', headColor: '#a24bff', sampleColor: '#a24bff',
        bodyGradient: (t) => `rgba(${Math.floor(60+t*102)},${Math.floor(20+t*55)},${Math.floor(120+t*135)},1)`
      },
      {
        id: 'green', name: '绿色', headColor: '#9ef01a', sampleColor: '#9ef01a',
        bodyGradient: (t) => `rgba(${Math.floor(4+t*80)},${Math.floor(140+t*80)},${Math.floor(20+t*40)},1)`
      },
      {
        id: 'yellow', name: '黄色', headColor: '#ffe14d', sampleColor: '#ffe14d',
        bodyGradient: (t) => `rgba(${Math.floor(90+t*165)},${Math.floor(80+t*145)},${Math.floor(20+t*57)},1)`
      },
      {
        id: 'red', name: '红色', headColor: '#ff4d4d', sampleColor: '#ff4d4d',
        bodyGradient: (t) => `rgba(${Math.floor(100+t*155)},${Math.floor(25+t*50)},${Math.floor(25+t*50)},1)`
      },
    ];
    const fallback = skins.map(s => ({ id:s.id, name:s.name, headColor:s.headColor, sampleColor:s.sampleColor, bodyGradient:s.bodyGradient }));

    function getSkinSet() {
      if (!skins || skins.length !== 6) return fallback;
      return skins;
    }
    function getSkin(id) {
      return skins.find(s => s.id === id) || null;
    }
    function getDefaultSkinId() {
      return DEFAULT_SKIN_ID;
    }
    return { getSkinSet, getSkin, getDefaultSkinId };
  })();

  // ===== 模式配置模块（ModeConfig） =====
  const ModeConfig = (() => {
    const modes = [
      { id: 'single', name: '单人模式', playerCount: 1, description: '一位玩家使用 WASD 操作' },
      { id: 'double', name: '双人模式', playerCount: 2, description: '两位玩家分别使用 WASD 与方向键' },
    ];
    const fallback = modes.map(m => ({ id:m.id, name:m.name, playerCount:m.playerCount, description:m.description }));

    function getModeSet() {
      if (!modes || modes.length !== 2) return fallback;
      return modes;
    }
    function getMode(id) {
      return modes.find(m => m.id === id) || null;
    }
    function getDefaultModeId() {
      return DEFAULT_MODE_ID;
    }
    return { getModeSet, getMode, getDefaultModeId };
  })();

  // ===== 名字校验模块（NameValidator） =====
  const NameValidator = (() => {
    function validateName(text) {
      if (!text || text.length === 0) return { valid: false, reason: '昵称不能为空' };
      if (text.length > NAME_MAX_LENGTH) return { valid: false, reason: '昵称长度不能超过' + NAME_MAX_LENGTH + '字符' };
      if (!NAME_ALLOWED_REGEX.test(text)) return { valid: false, reason: '昵称仅允许中文、英文字母、数字与下划线' };
      return { valid: true, reason: '' };
    }
    function isAllowedChar(ch) {
      return /^[\u4e00-\u9fa5A-Za-z0-9_]$/.test(ch);
    }
    function isNameDuplicate(n1, n2) { return n1 === n2; }
    function getDefaultName(playerId) { return playerId === '玩家2' ? '玩家2' : '玩家1'; }
    return { validateName, isAllowedChar, isNameDuplicate, getDefaultName, NAME_MAX_LENGTH };
  })();

  // ===== DOM 引用 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl1 = document.getElementById('score1');
  const scoreEl2 = document.getElementById('score2');
  const statusEl = document.getElementById('status');
  const btnStart = document.getElementById('btn-start');
  const btnRestart = document.getElementById('btn-restart');
  const touch = document.getElementById('touch');
  const cellW = canvas.width / COLS;
  const cellH = canvas.height / ROWS;

  // ===== 状态层 =====
  let players, food, totalEaten, speed, running, gameState, timerId;

  // ===== 工具层 =====
  function isOpposite(a, b) {
    return a.x + b.x === 0 && a.y + b.y === 0;
  }

  function occupiedCells() {
    const cells = [];
    for (const p of players) {
      for (const c of p.snake) cells.push({x:c.x, y:c.y});
    }
    return cells;
  }

  function roundRectFill(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ===== 游戏逻辑层 =====
  function reset(mode, names, skinMap) {
    const m = mode || DEFAULT_MODE_ID;
    const modeItem = ModeConfig.getMode(m);
    const playerCount = modeItem ? modeItem.playerCount : 2;
    const s1Id = (skinMap && skinMap['玩家1']) || SkinConfig.getDefaultSkinId();
    const s2Id = (skinMap && skinMap['玩家2']) || 'blue';
    const s1 = SkinConfig.getSkin(s1Id) || SkinConfig.getSkin(SkinConfig.getDefaultSkinId());
    const s2 = SkinConfig.getSkin(s2Id) || SkinConfig.getSkin('blue');
    const n1 = (names && names['玩家1']) || NameValidator.getDefaultName('玩家1');
    const n2 = (names && names['玩家2']) || NameValidator.getDefaultName('玩家2');
    players = [
      {
        id: '玩家1', name: n1,
        snake: [{x:6,y:11},{x:5,y:11},{x:4,y:11}],
        dir: DIR.RIGHT, nextDir: DIR.RIGHT, score: 0, alive: true,
        skinId: s1.id, colorHead: s1.headColor, colorBody: s1.id,
      },
    ];
    if (playerCount === 2) {
      players.push({
        id: '玩家2', name: n2,
        snake: [{x:17,y:12},{x:18,y:12},{x:19,y:12}],
        dir: DIR.LEFT, nextDir: DIR.LEFT, score: 0, alive: true,
        skinId: s2.id, colorHead: s2.headColor, colorBody: s2.id,
      });
    }
    food = null;
    totalEaten = 0;
    speed = INIT_SPEED;
    running = false;
    gameState = '待开始';
    spawnFood();
    updateHUD();
    draw();
    showStatus(playerCount === 1 ? n1 + ': WASD · 按键开始' : n1 + ': WASD · ' + n2 + ': 方向键 · 按键开始');
    btnStart.textContent = '开始/暂停';
    clearInterval(timerId);
  }

  function start() {
    if (gameState === '游戏结束') return;
    if (running) {
      running = false;
      gameState = '已暂停';
      clearInterval(timerId);
      showStatus('已暂停');
      btnStart.textContent = '继续';
    } else {
      running = true;
      gameState = '进行中';
      timerId = setInterval(tick, speed);
      showStatus('进行中');
      btnStart.textContent = '暂停';
    }
  }

  function spawnFood() {
    const occupied = occupiedCells();
    const free = [];
    for (let y=0; y<ROWS; y++) {
      for (let x=0; x<COLS; x++) {
        if (!occupied.some(c => c.x===x && c.y===y)) {
          free.push({x,y});
        }
      }
    }
    if (free.length === 0) {
      food = null;
      return false;
    }
    food = free[Math.floor(Math.random()*free.length)];
    return true;
  }

  function computeHeads() {
    for (const p of players) {
      if (p.alive) {
        p.dir = p.nextDir;
        p._newHead = {x: p.snake[0].x + p.dir.x, y: p.snake[0].y + p.dir.y};
      } else {
        p._newHead = null;
      }
    }
  }

  function resolveCollisions() {
    const n = players.length;
    if (n >= 2) {
      const h1 = players[0]._newHead;
      const h2 = players[1]._newHead;
      if (h1 && h2 && h1.x === h2.x && h1.y === h2.y) {
        players[0].alive = false;
        players[1].alive = false;
        return;
      }
    }
    for (let i=0; i<n; i++) {
      const p = players[i];
      const head = p._newHead;
      if (!head) continue;
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        p.alive = false;
        continue;
      }
      const body = p.snake.slice(0, -1);
      if (body.some(c => c.x === head.x && c.y === head.y)) {
        p.alive = false;
        continue;
      }
      if (n >= 2) {
        const other = players[1-i];
        if (other.snake.some(c => c.x === head.x && c.y === head.y)) {
          p.alive = false;
          continue;
        }
      }
    }
  }

  function applyMoves() {
    let ate = false;
    for (const p of players) {
      if (!p.alive) continue;
      p.snake.unshift(p._newHead);
      if (food && p._newHead.x === food.x && p._newHead.y === food.y) {
        p.score++;
        totalEaten++;
        ate = true;
      } else {
        p.snake.pop();
      }
    }
    if (ate) {
      speed = Math.max(MIN_SPEED, INIT_SPEED - totalEaten * SPEED_STEP);
      if (!spawnFood()) {
        for (const p of players) p.alive = false;
      }
      clearInterval(timerId);
      timerId = setInterval(tick, speed);
      updateHUD();
    }
  }

  function tick() {
    computeHeads();
    resolveCollisions();
    applyMoves();
    draw();
    if (players.every(p => !p.alive)) {
      judgeGameOver();
    }
  }

  function judgeGameOver() {
    running = false;
    clearInterval(timerId);
    gameState = '游戏结束';
    let text;
    if (players.length === 1) {
      text = players[0].name + ' 得分: ' + players[0].score;
    } else {
      const s1 = players[0].score;
      const s2 = players[1].score;
      const n1 = players[0].name;
      const n2 = players[1].name;
      if (players[0].alive && !players[1].alive) {
        text = n1 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
      } else if (!players[0].alive && players[1].alive) {
        text = n2 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
      } else {
        if (s1 > s2) text = n1 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
        else if (s1 < s2) text = n2 + ' 胜出 · ' + n1 + ': ' + s1 + ' · ' + n2 + ': ' + s2;
        else text = '平局 · 双方: ' + s1;
      }
    }
    showStatus(text + ' · 按 空格 或 点击 重新开始');
    btnStart.textContent = '开始/继续';
  }

  // ===== 渲染层 =====
  function updateHUD() {
    scoreEl1.textContent = players[0].score;
    if (players.length >= 2) {
      scoreEl2.parentElement.style.display = '';
      scoreEl2.textContent = players[1].score;
    } else {
      scoreEl2.parentElement.style.display = 'none';
    }
  }

  function showStatus(text) {
    statusEl.textContent = text;
  }

  function draw() {
    drawBackground();
    drawFood();
    for (const p of players) drawSnake(p);
  }

  function drawBackground() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let r=0; r<ROWS; r++) {
      for (let c=0; c<COLS; c++) {
        if ((r+c)%2===0) ctx.fillStyle = '#07172a';
        else ctx.fillStyle = '#061226';
        ctx.fillRect(c*cellW, r*cellH, cellW, cellH);
      }
    }
  }

  function drawFood() {
    if (!food) return;
    ctx.fillStyle = '#ff3b3b';
    roundRectFill(food.x*cellW+cellW*0.12, food.y*cellH+cellH*0.12, cellW*0.76, cellH*0.76, 6);
  }

  function drawSnake(player) {
    const snake = player.snake;
    const skin = SkinConfig.getSkin(player.skinId) || SkinConfig.getSkin(SkinConfig.getDefaultSkinId());
    for (let i=snake.length-1; i>=0; i--) {
      const p = snake[i];
      if (i === 0) {
        ctx.fillStyle = player.colorHead;
        roundRectFill(p.x*cellW+2, p.y*cellH+2, cellW-4, cellH-4, 6);
      } else {
        const t = 1 - i/snake.length;
        ctx.fillStyle = skin.bodyGradient(t);
        roundRectFill(p.x*cellW+4, p.y*cellH+4, cellW-8, cellH-8, 5);
      }
    }
  }

  // ===== 模式选择状态机（ModeSelectFSM） =====

  // ===== 名字填写界面模块（NameInputUI） =====
  const NameInputUI = (() => {

  // ===== 名字填写状态机（NameInputFSM） =====
  const NameInputFSM = (() => {
    let state = 'Idle';
    let session = null;
    const lastNameMemory = { '玩家1': null, '玩家2': null };
    let onSubmit = null;
    let onBack = null;

    function setCallbacks(cb) { onSubmit = cb.onSubmit; onBack = cb.onBack; }

    function enter(ctx) {
      if (state !== 'Idle') return;
      if (!ctx || !ctx.mode) { console.warn('[NameInputFSM] missing mode'); return; }
      state = 'Showing';
      const modeItem = ModeConfig.getMode(ctx.mode);
      const playerCount = modeItem ? modeItem.playerCount : 2;
      const playerIds = playerCount === 1 ? ['玩家1'] : ['玩家1', '玩家2'];
      session = {
        active: true,
        mode: ctx.mode,
        players: playerIds.map(id => ({ playerId: id })),
        entries: {},
      };
      playerIds.forEach(id => {
        session.entries[id] = { value: lastNameMemory[id] || NameValidator.getDefaultName(id) };
      });
      NameInputUI.renderNameInput(session);
    }

    function updateName(playerId, text) {
      if (state !== 'Showing' || !session) return;
      if (!session.entries[playerId]) return;
      let filtered = '';
      for (const ch of text) {
        if (NameValidator.isAllowedChar(ch)) filtered += ch;
        if (filtered.length >= NameValidator.NAME_MAX_LENGTH) break;
      }
      session.entries[playerId].value = filtered;
      NameInputUI.updateFieldValue(playerId, filtered);
    }

    function next() {
      if (state !== 'Showing' || !session) return;
      const playerIds = session.players.map(p => p.playerId);
      for (const playerId of playerIds) {
        const v = NameValidator.validateName(session.entries[playerId].value);
        if (!v.valid) {
          NameInputUI.showNameTip(v.reason);
          NameInputUI.focusInput(playerId);
          return;
        }
      }
      if (session.mode === 'double' && playerIds.length === 2) {
        if (NameValidator.isNameDuplicate(session.entries['玩家1'].value, session.entries['玩家2'].value)) {
          NameInputUI.showNameTip('两位玩家昵称不能相同');
          return;
        }
      }
      const names = {};
      playerIds.forEach(id => { names[id] = session.entries[id].value; lastNameMemory[id] = names[id]; });
      const cb = onSubmit;
      state = 'Idle';
      session = null;
      NameInputUI.dispose();
      if (cb) cb(names);
    }

    function back() {
      if (state !== 'Showing' || !session) return;
      session.players.forEach(p => { lastNameMemory[p.playerId] = session.entries[p.playerId].value; });
      const cb = onBack;
      state = 'Idle';
      session = null;
      NameInputUI.dispose();
      if (cb) cb();
    }

    return { setCallbacks, enter, updateName, next, back, isActive: () => state === 'Showing', getSession: () => session };
  })();

  // ===== 颜色选择界面模块（SelectionUI，扩展单人模式） =====
  const SelectionUI = (() => {
    const root = document.getElementById('skin-selection');
    const itemsContainers = [document.getElementById('skin-items-0'), document.getElementById('skin-items-1')];
    const playerEls = [itemsContainers[0].parentElement, itemsContainers[1].parentElement];
    const tipEl = document.getElementById('skin-tip');
    const confirmBtn = document.getElementById('skin-confirm');
    const backBtn = document.getElementById('skin-back');
    const previewCanvas = document.getElementById('skin-preview-canvas');
    const pctx = previewCanvas.getContext('2d');
    let rafId = null;
    let currentSession = null;
    let itemEls = [[], []];
    let tipTimer = null;

    function roundRectFillPreview(x, y, w, h, r) {
      pctx.beginPath();
      pctx.moveTo(x+r, y);
      pctx.arcTo(x+w, y, x+w, y+h, r);
      pctx.arcTo(x+w, y+h, x, y+h, r);
      pctx.arcTo(x, y+h, x, y, r);
      pctx.arcTo(x, y, x+w, y, r);
      pctx.closePath();
      pctx.fill();
    }

    function renderSelection(session) {
      currentSession = session;
      root.hidden = false;
      const skinSet = SkinConfig.getSkinSet();
      const playerCount = session.mode === 'single' ? 1 : 2;
      for (let pi = 0; pi < 2; pi++) {
        if (pi < playerCount) {
          playerEls[pi].hidden = false;
          const container = itemsContainers[pi];
          container.innerHTML = '';
          itemEls[pi] = [];
          skinSet.forEach((skin, idx) => {
            const item = document.createElement('div');
            item.className = 'skin-item';
            item.dataset.player = pi;
            item.dataset.idx = idx;
            item.dataset.skinId = skin.id;
            const swatch = document.createElement('div');
            swatch.className = 'swatch';
            swatch.style.background = skin.sampleColor;
            swatch.style.color = skin.sampleColor;
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = skin.name;
            item.appendChild(swatch);
            item.appendChild(label);
            container.appendChild(item);
            itemEls[pi].push(item);
          });
        } else {
          playerEls[pi].hidden = true;
          itemEls[pi] = [];
        }
      }
      updateHighlight(session);
      startPreview();
    }

    function updateHighlight(session) {
      const skinSet = SkinConfig.getSkinSet();
      const playerCount = session.mode === 'single' ? 1 : 2;
      for (let pi = 0; pi < playerCount; pi++) {
        const sel = session.players[pi].selectedSkinId;
        skinSet.forEach((skin, idx) => {
          const el = itemEls[pi][idx];
          if (!el) return;
          el.classList.toggle('selected-p1', pi === 0 && skin.id === sel);
          el.classList.toggle('selected-p2', pi === 1 && skin.id === sel);
        });
      }
    }

    function startPreview() {
      if (rafId) cancelAnimationFrame(rafId);
      const loop = () => {
        drawPreview();
        rafId = requestAnimationFrame(loop);
      };
      loop();
    }

    function drawPreview() {
      if (!currentSession) return;
      pctx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      pctx.fillStyle = '#07172a';
      pctx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
      const segW = 18, segH = 14, gap = 2, segs = 7;
      const playerCount = currentSession.mode === 'single' ? 1 : 2;
      for (let pi = 0; pi < playerCount; pi++) {
        const sel = currentSession.players[pi].selectedSkinId;
        const skin = SkinConfig.getSkin(sel) || SkinConfig.getSkin(SkinConfig.getDefaultSkinId());
        const yBase = pi * (segH + 14) + 10;
        for (let i = segs - 1; i >= 0; i--) {
          const x = 12 + i * (segW + gap);
          if (i === 0) {
            pctx.fillStyle = skin.headColor;
          } else {
            const t = 1 - i / segs;
            pctx.fillStyle = skin.bodyGradient(t);
          }
          roundRectFillPreview(x, yBase, segW, segH, 4);
        }
      }
    }

    function showSelectionTip(text) {
      tipEl.textContent = text;
      if (tipTimer) clearTimeout(tipTimer);
      tipTimer = setTimeout(() => { tipEl.textContent = ''; }, TIP_AUTO_CLEAR_MS);
    }

    function dispose() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      root.hidden = true;
      currentSession = null;
      if (tipTimer) clearTimeout(tipTimer);
      tipEl.textContent = '';
    }

    return {
      renderSelection, updateHighlight, showSelectionTip, dispose,
      confirmBtn, backBtn, root,
      getItemEl: (pi, idx) => (itemEls[pi] ? itemEls[pi][idx] : null)
    };
  })();

  // ===== 颜色选择状态机（SelectionFSM，扩展按模式裁剪玩家） =====
  const SelectionFSM = (() => {
    let state = 'Idle';
    let session = null;
    let lastConfirmAt = 0;
    const lastSelectionMemory = { '玩家1': null, '玩家2': null };
    let onSubmit = null;
    let onBack = null;

    function setCallbacks(cb) { onSubmit = cb.onSubmit; onBack = cb.onBack; }

    function enterSelection(ctx) {
      if (!ctx || !ctx.players || ctx.players.length === 0) {
        console.warn('[SelectionFSM] invalid ctx, stay Idle');
        return;
      }
      state = 'Showing';
      const mode = ctx.mode || 'double';
      const modeItem = ModeConfig.getMode(mode);
      const playerCount = modeItem ? modeItem.playerCount : 2;
      const players = playerCount === 1 ? [ctx.players[0]] : ctx.players;
      const skinSet = SkinConfig.getSkinSet();
      session = {
        active: true,
        mode,
        players: players.map(pl => ({
          playerId: pl.id,
          selectedSkinId: (ctx.lastSelections && ctx.lastSelections[pl.id]) || lastSelectionMemory[pl.id] || SkinConfig.getDefaultSkinId(),
          confirmed: false,
        })),
        skinSet,
        lastConfirmAt: 0,
      };
      SelectionUI.renderSelection(session);
    }

    function selectColor(playerId, skinId) {
      if (state !== 'Showing' || !session) return;
      const pl = session.players.find(p => p.playerId === playerId);
      if (!pl) return;
      if (!SkinConfig.getSkin(skinId)) return;
      pl.selectedSkinId = skinId;
      SelectionUI.updateHighlight(session);
    }

    function confirm() {
      if (state !== 'Showing' || !session) return { ok: false, reason: '状态无效' };
      const now = Date.now();
      if (now - lastConfirmAt < CONFIRM_DEBOUNCE_MS) return { ok: false, reason: '去抖中' };
      lastConfirmAt = now;
      state = 'Checking';
      const unselected = session.players.find(p => !p.selectedSkinId);
      if (unselected) {
        state = 'Showing';
        SelectionUI.showSelectionTip('请先选择皮肤颜色');
        return { ok: false, reason: '请先选择皮肤颜色' };
      }
      if (session.mode === 'double' && session.players.length === 2) {
        if (session.players[0].selectedSkinId === session.players[1].selectedSkinId) {
          state = 'Showing';
          SelectionUI.showSelectionTip('双方颜色不能相同');
          return { ok: false, reason: '双方颜色不能相同' };
        }
      }
      state = 'Submitted';
      const skinMap = {};
      session.players.forEach(p => { skinMap[p.playerId] = p.selectedSkinId; lastSelectionMemory[p.playerId] = p.selectedSkinId; });
      const result = { ok: true, skinMap, mode: session.mode };
      SelectionUI.dispose();
      const cb = onSubmit;
      state = 'Idle';
      session = null;
      if (cb) cb(result);
      return result;
    }

    function goBack() {
      if (state !== 'Showing' || !session) return;
      session.players.forEach(p => { lastSelectionMemory[p.playerId] = p.selectedSkinId; });
      SelectionUI.dispose();
      const cb = onBack;
      state = 'Idle';
      session = null;
      if (cb) cb();
    }

    return {
      setCallbacks, enterSelection, selectColor, confirm, goBack,
      isActive: () => state === 'Showing',
      getSession: () => session
    };
  })();

  // ===== 输入适配模块（InputAdapter，多环节分发） =====
  const InputAdapter = (() => {
    function init() {
      ModeSelectUI.root.addEventListener('click', (e) => {
        const item = e.target.closest('.mode-item');
        if (item) { ModeSelectFSM.selectMode(item.dataset.modeId); return; }
      });
      ModeSelectUI.nextBtn.addEventListener('click', () => { ModeSelectFSM.next(); });
      ModeSelectUI.backBtn.addEventListener('click', () => { ModeSelectFSM.back(); });

      NameInputUI.root.addEventListener('input', (e) => {
        if (e.target.tagName === 'INPUT') {
          NameInputFSM.updateName(e.target.dataset.playerId, e.target.value);
        }
      });
      NameInputUI.nextBtn.addEventListener('click', () => { NameInputFSM.next(); });
      NameInputUI.backBtn.addEventListener('click', () => { NameInputFSM.back(); });

      SelectionUI.root.addEventListener('click', (e) => {
        const item = e.target.closest('.skin-item');
        if (item) {
          const pi = parseInt(item.dataset.player, 10);
          const skinId = item.dataset.skinId;
          SelectionFSM.selectColor('玩家' + (pi + 1), skinId);
          return;
        }
      });
      SelectionUI.confirmBtn.addEventListener('click', () => { SelectionFSM.confirm(); });
      SelectionUI.backBtn.addEventListener('click', () => { SelectionFSM.goBack(); });
    }

    function moveModeCursor(delta) {
      const session = ModeSelectFSM.getSession();
      if (!session) return;
      const modeSet = ModeConfig.getModeSet();
      let idx = modeSet.findIndex(m => m.id === session.selectedModeId);
      if (idx < 0) idx = 0;
      idx = (idx + delta + modeSet.length) % modeSet.length;
      ModeSelectFSM.selectMode(modeSet[idx].id);
    }

    function moveColorCursor(playerId, delta) {
      const session = SelectionFSM.getSession();
      if (!session) return;
      const pl = session.players.find(p => p.playerId === playerId);
      if (!pl) return;
      const skinSet = SkinConfig.getSkinSet();
      let idx = skinSet.findIndex(s => s.id === pl.selectedSkinId);
      if (idx < 0) idx = 0;
      idx = (idx + delta + skinSet.length) % skinSet.length;
      SelectionFSM.selectColor(playerId, skinSet[idx].id);
    }

    function handleModeKeydown(e) {
      const key = e.key;
      if (key === 'w' || key === 'W' || key === 'ArrowUp') { e.preventDefault(); moveModeCursor(-1); return true; }
      if (key === 's' || key === 'S' || key === 'ArrowDown') { e.preventDefault(); moveModeCursor(1); return true; }
      if (key === 'Enter') { e.preventDefault(); ModeSelectFSM.next(); return true; }
      if (key === 'Escape') { e.preventDefault(); ModeSelectFSM.back(); return true; }
      e.preventDefault();
      return true;
    }

    function handleNameKeydown(e) {
      const key = e.key;
      if (key === 'Enter') { e.preventDefault(); NameInputFSM.next(); return true; }
      if (key === 'Escape') { e.preventDefault(); NameInputFSM.back(); return true; }
      if (key === ' ') { e.preventDefault(); return true; }
      return true;
    }

    function handleColorKeydown(e) {
      const key = e.key;
      const session = SelectionFSM.getSession();
      const isSingle = session && session.mode === 'single';
      if (key === 'a' || key === 'A') { e.preventDefault(); moveColorCursor('玩家1', -1); return true; }
      if (key === 'd' || key === 'D') { e.preventDefault(); moveColorCursor('玩家1', 1); return true; }
      if (!isSingle && key === 'ArrowLeft') { e.preventDefault(); moveColorCursor('玩家2', -1); return true; }
      if (!isSingle && key === 'ArrowRight') { e.preventDefault(); moveColorCursor('玩家2', 1); return true; }
      if (key === 'Enter') { e.preventDefault(); SelectionFSM.confirm(); return true; }
      if (key === 'Escape') { e.preventDefault(); SelectionFSM.goBack(); return true; }
      if (key === ' ' || key === 'w' || key === 'W' || key === 's' || key === 'S'
          || key === 'ArrowUp' || key === 'ArrowDown') {
        e.preventDefault();
        return true;
      }
      if (isSingle && (key === 'ArrowLeft' || key === 'ArrowRight')) { e.preventDefault(); return true; }
      return true;
    }

    function handleKeydown(e) {
      if (ModeSelectFSM.isActive()) return handleModeKeydown(e);
      if (NameInputFSM.isActive()) return handleNameKeydown(e);
      if (SelectionFSM.isActive()) return handleColorKeydown(e);
      return false;
    }

    return { init, handleKeydown };
  })();

  // ===== 流程编排模块（SetupFlow，三步串联） =====
  const SetupFlow = (() => {
    let stage = 'Idle';
    let mode = null;
    let names = null;

    function init() {
      ModeSelectFSM.setCallbacks({
        onSubmit: (modeId) => {
          mode = modeId;
          stage = 'NameStage';
          NameInputFSM.enter({ mode });
        },
        onBack: () => {
          stage = 'Idle';
          startSetup();
        },
      });
      NameInputFSM.setCallbacks({
        onSubmit: (n) => {
          names = n;
          stage = 'ColorStage';
          const modeItem = ModeConfig.getMode(mode);
          const playerCount = modeItem ? modeItem.playerCount : 2;
          const players = playerCount === 1
            ? [{ id: '玩家1', name: names['玩家1'] }]
            : [{ id: '玩家1', name: names['玩家1'] }, { id: '玩家2', name: names['玩家2'] }];
          SelectionFSM.enterSelection({ mode, players });
        },
        onBack: () => {
          stage = 'ModeStage';
          ModeSelectFSM.enter({});
        },
      });
      SelectionFSM.setCallbacks({
        onSubmit: (result) => {
          stage = 'Submitted';
          reset(mode, names, result.skinMap);
          start();
          stage = 'Idle';
        },
        onBack: () => {
          stage = 'NameStage';
          NameInputFSM.enter({ mode });
        },
      });
    }

    function startSetup() {
      stage = 'ModeStage';
      ModeSelectFSM.enter({});
    }

    return { init, startSetup };
  })();

  // ===== 输入分发层 =====
  function trySetDir(player, d) {
    if (!d) return;
    if (gameState === '游戏结束') return;
    if (isOpposite(d, player.dir)) return;
    player.nextDir = d;
    if (!running && gameState !== '游戏结束') {
      start();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (InputAdapter.handleKeydown(e)) return;
    const key = e.key;
    if (P1_KEYS[key]) {
      trySetDir(players[0], P1_KEYS[key]);
    }
    if (players.length >= 2 && P2_KEYS[key]) {
      e.preventDefault();
      trySetDir(players[1], P2_KEYS[key]);
    }
    if (key === ' ') {
      e.preventDefault();
      reset();
      start();
    }
    if (key === 'Enter') {
      start();
    }
  });

  btnStart.addEventListener('click', start);
  btnRestart.addEventListener('click', () => { reset(); start(); });

  touch.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const d = btn.dataset.dir;
    if (d==='up') trySetDir(players[0], DIR.UP);
    if (d==='down') trySetDir(players[0], DIR.DOWN);
    if (d==='left') trySetDir(players[0], DIR.LEFT);
    if (d==='right') trySetDir(players[0], DIR.RIGHT);
  });

  // ===== 初始化 =====
  reset();
  SetupFlow.init();
  InputAdapter.init();
  SetupFlow.startSetup();

})();
</script>
